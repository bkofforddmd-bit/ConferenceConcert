[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# One Facebook post a day, 13:00 UTC = 9 AM EDT / 8 AM EST (see SETUP-FACEBOOK.md)
[functions."daily-post"]
  schedule = "0 13 * * *"

# Optional: nicer paths if you ever want them.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
