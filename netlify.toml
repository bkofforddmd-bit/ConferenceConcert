[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Facebook posting check every half hour: scheduled songs at their time, the
# daily series at its time of day (both Eastern; see SETUP-FACEBOOK.md)
[functions."daily-post"]
  schedule = "*/30 * * * *"

# Optional: nicer paths if you ever want them.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
